server:
  port: 8080

spring:
  application:
    name: movie-matcher

  # PostgreSQL Configuration (matching your docker-compose.yml)
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration (matching your docker-compose.yml)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

# Custom Application / Security / JWT Properties
application:
  security:
    jwt:
      # Secret key (Base64 encoded 256-bit key) - customize as needed
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 24 hours in milliseconds
    cors:
      # Defaults to localhost for local dev; can be overridden via APP_CORS_ALLOWED_ORIGINS
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}