server:
  port: 8080

spring:
  application:
    name: movie-matcher

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

application:
  security:
    jwt:
      # NEVER hardcode the production secret here.
      # The fallback below is strictly for local development.
      secret-key: ${JWT_SECRET_KEY:REPLACE_ME_FOR_LOCAL_DEV}
      expiration: 86400000
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  booking:
    seat-lock-duration-seconds: 600

omdb:
  api:
    key: ${OMDB_API_KEY}
    url: "https://www.omdbapi.com"